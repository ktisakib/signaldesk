name: signaldesk-relay
services:
  mediamtx:
    image: bluenviron/mediamtx:1.21.3
    restart: unless-stopped
    user: '10001:10001'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - '${RELAY_BIND_IP:-0.0.0.0}:${RELAY_SRT_PORT:-8890}:8890/udp'
    environment:
      MTX_AUTHHTTPADDRESS: 'http://relay:9791/auth/${RELAY_HOOK_TOKEN:?Run scripts/setup-relay.py first}'
    volumes:
      - ./docker/relay-mediamtx.yml:/mediamtx.yml:ro
    mem_limit: 512m
    logging: &logs
      driver: json-file
      options: {max-size: '10m', max-file: '3'}
  relay:
    image: '${RELAY_IMAGE:-signaldesk-relay:local}'
    build:
      context: .
      target: relay-runtime
    init: true
    restart: unless-stopped
    depends_on: [mediamtx]
    environment:
      RELAY_ADMIN_TOKEN: '${RELAY_ADMIN_TOKEN:?Run scripts/setup-relay.py first}'
      RELAY_HOOK_TOKEN: '${RELAY_HOOK_TOKEN:?Run scripts/setup-relay.py first}'
      RELAY_MEDIA_API: http://mediamtx:9997
      RELAY_HOME: /data
      BROADCAST_WEB_ROOT: /app/web
    volumes: [relay-data:/data]
    read_only: true
    tmpfs: ['/tmp:size=16m,mode=1777']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    logging: *logs
  gateway:
    image: caddy:2.11.2-alpine
    # The official executable carries this file capability and cannot execute without it.
    cap_add: [NET_BIND_SERVICE]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8088/api/health]
      interval: 5s
      timeout: 3s
      retries: 6
    restart: unless-stopped
    depends_on:
      relay: {condition: service_healthy}
    ports:
      - '${RELAY_BIND_IP:-0.0.0.0}:${RELAY_HTTP_PORT:-8088}:8088'
    volumes: ['./docker/relay.Caddyfile:/etc/caddy/Caddyfile:ro']
    read_only: true
    tmpfs: ['/config:size=8m', '/data:size=8m']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *logs
volumes:
  relay-data:
