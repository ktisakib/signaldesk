name: Verify published Windows installer offline
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag
        type: string
        required: true

permissions:
  contents: read

jobs:
  offline:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Fetch the released installer and verify SHA-256
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if ($env:TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Expected a version tag' }
          gh release download $env:TAG -R $env:GITHUB_REPOSITORY -p '*.exe' -p SHA256SUMS.txt
          if ($LASTEXITCODE) { throw 'Release download failed' }
          $exe = @(Get-ChildItem *.exe)
          if ($exe.Count -ne 1) { throw 'Expected one installer' }
          $digest = (Get-FileHash $exe[0] -Algorithm SHA256).Hash.ToLowerInvariant()
          if ((Get-Content SHA256SUMS.txt -Raw).Trim() -cne "$digest  $($exe[0].Name)") { throw 'Checksum mismatch' }
          Write-Host "Verified $($exe[0].Name) SHA-256 $digest"
      - name: Install and decode the test signal with all network adapters blocked
        shell: pwsh
        timeout-minutes: 6
        run: |
          $installer = (Get-ChildItem *.exe).FullName
          $destination = Join-Path $env:LOCALAPPDATA 'SignalDesk'
          if (Test-Path $destination) { throw 'Expected a fresh Windows profile' }
          $external = @('0.0.0.0-126.255.255.255', '128.0.0.0-255.255.255.255', '::2-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff')
          $probe = @('--noproxy', '*', '--silent', '--max-time', '5', '--head', '--output', 'NUL', 'https://github.com')
          curl.exe @probe
          if ($LASTEXITCODE) { throw 'Internet probe failed before isolation' }
          $rule = New-NetFirewallRule -DisplayName 'SignalDesk clean offline test' -Direction Outbound -RemoteAddress $external -Profile Any -Action Block
          try {
            curl.exe @probe
            if (!$LASTEXITCODE) { throw 'Internet is still reachable' }
            Write-Host 'Verified external access is blocked'
            $p = Start-Process $installer -ArgumentList '/S' -PassThru
            if (!$p.WaitForExit(150000) -or $p.ExitCode -ne 0) { throw 'Offline install failed or timed out' }
            Write-Host 'Clean offline install passed'
            $studio = Get-ChildItem $destination -Filter '*.exe' | Where-Object Name -ne 'uninstall.exe' | Select-Object -First 1
            Start-Process -FilePath $studio.FullName
            $api = 'http://127.0.0.1:9780/api'
            $ready = $false
            foreach ($i in 1..40) {
              try { $ready = (Invoke-RestMethod "$api/health" -TimeoutSec 2 -NoProxy).service -eq 'signaldesk' } catch {}
              if ($ready) { break }
              Start-Sleep -Milliseconds 500
            }
            if (!$ready) { throw 'Desktop app did not start its installed engine' }
            $null = Invoke-RestMethod "$api/broadcast/start" -Method Post -ContentType 'application/json' -Body '{"source":"test"}' -NoProxy
            $url = 'http://127.0.0.1:8888/live/index.m3u8'
            $playlist = $false
            foreach ($i in 1..30) {
              $manifest = curl.exe --noproxy '*' --location --fail --silent --max-time 5 $url
              $playlist = ($LASTEXITCODE -eq 0) -and ($manifest -contains '#EXTM3U')
              if ($playlist) { break }
              Start-Sleep -Seconds 1
            }
            if (!$playlist) {
              Invoke-RestMethod "$api/status" -NoProxy | ConvertTo-Json -Depth 5
              Get-NetTCPConnection -State Listen -LocalPort 8888,8554 -ErrorAction SilentlyContinue | Format-Table
              Write-Host "Last playlist response ($LASTEXITCODE): $manifest"
              throw 'HLS test signal did not appear'
            }
            $progress = & "$destination/runtime/bin/ffmpeg.exe" -nostdin -v error -xerror -rw_timeout 10000000 -i $url -t 5 -map 0:v:0 -f null - -progress pipe:1
            $decodeExit = $LASTEXITCODE
            $frames = $progress | Select-String '^frame=(\d+)$' | Select-Object -Last 1
            if ($decodeExit -or !$frames -or [int]$frames.Matches[0].Groups[1].Value -lt 125 -or !($progress -contains 'progress=end')) { throw "Could not decode five seconds of test video: $progress" }
            Write-Host 'PASS: installed desktop started and its live HLS test signal decoded for five seconds offline'
            $null = Invoke-RestMethod "$api/broadcast/stop" -Method Post -NoProxy
            $clip = Join-Path $env:RUNNER_TEMP 'offline upgrade sample.mp4'
            & "$destination/runtime/bin/ffmpeg.exe" -v error -y -f lavfi -i 'color=blue:size=320x240:duration=1' -c:v libx264 $clip
            if ($LASTEXITCODE) { throw 'Could not create upgrade sample' }
            $media = Invoke-RestMethod "$api/library" -Method Post -ContentType 'application/json' -Body (@{ path = $clip } | ConvertTo-Json) -NoProxy
            $null = Invoke-RestMethod "$api/queue" -Method Put -ContentType 'application/json' -Body (@{ ids = @($media.id) } | ConvertTo-Json) -NoProxy
            $null = Invoke-RestMethod "$api/system/shutdown" -Method Post -NoProxy
            Get-Process $studio.BaseName -ErrorAction SilentlyContinue | Stop-Process -Force
            Start-Sleep -Seconds 2
            $sentinel = Join-Path $destination 'operator-data-sentinel.txt'
            'preserve operator data' | Set-Content $sentinel
            $p = Start-Process $installer -ArgumentList @('/S', '/UPDATE') -PassThru
            if (!$p.WaitForExit(150000) -or $p.ExitCode -ne 0) { throw 'Offline reinstall failed' }
            if ((Get-Content $sentinel -Raw).Trim() -ne 'preserve operator data') { throw 'Operator file was removed' }
            Start-Process -FilePath $studio.FullName
            $restored = $false
            foreach ($i in 1..40) {
              try {
                $queue = @(Invoke-RestMethod "$api/queue" -TimeoutSec 2 -NoProxy)
                $restored = $queue.Count -eq 1 -and $queue[0].id -eq $media.id
              } catch {}
              if ($restored) { break }
              Start-Sleep -Milliseconds 500
            }
            if (!$restored) { throw 'Saved queue did not survive reinstall' }
            Write-Host 'PASS: offline installer update mode preserved the database, saved queue and operator files'

          } finally {
            $rule | Remove-NetFirewallRule
          }
