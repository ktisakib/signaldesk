name: Windows checks and installer
on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm test
      - run: cargo fmt --all -- --check
      - name: Check PowerShell parser and archive validation
        shell: powershell
        run: |
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }
          ./scripts/setup-windows.ps1 -SelfTest
      - uses: msys2/setup-msys2@v2
        id: msys
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-ffmpeg mingw-w64-ucrt-x86_64-binutils
      - name: Build installer with standalone service
        shell: powershell
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: ./scripts/build-windows.ps1 -MsysRoot "${{ steps.msys.outputs.msys2-location }}"
      - name: Install from a single executable with media downloads blocked
        shell: powershell
        run: |
          $installer = Get-ChildItem target/release/bundle/nsis/*.exe
          $destination = Join-Path $env:RUNNER_TEMP 'SignalDesk installed'
          $env:HTTPS_PROXY = $env:HTTP_PROXY = 'http://127.0.0.1:1'
          $rule = New-NetFirewallRule -DisplayName 'SignalDesk installer offline test' -Direction Outbound -Program $installer.FullName -Action Block
          try {
            $process = Start-Process $installer.FullName -ArgumentList @('/S', "/D=$destination") -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Installer failed with exit code $($process.ExitCode)" }
          } finally { $rule | Remove-NetFirewallRule }
          $bin = Join-Path $destination 'runtime/bin'
          foreach ($tool in @('ffmpeg', 'ffprobe', 'mediamtx')) {
            $flag = if ($tool -eq 'mediamtx') { '--version' } else { '-version' }
            & "$bin/$tool.exe" $flag
            if ($LASTEXITCODE -ne 0) { throw "Installed $tool failed to launch." }
          }
          "SIGNALDESK_INSTALLED_ENGINE=$destination/runtime/broadcast-service.exe" >> $env:GITHUB_ENV
          "BROADCAST_BIN_DIR=$bin" >> $env:GITHUB_ENV
      - name: Smoke test detached Windows service
        shell: powershell
        run: |
          $env:BROADCAST_HOME = Join-Path $env:RUNNER_TEMP 'signaldesk-smoke'
          try {
            ./scripts/start-service.ps1 -ServicePath $env:SIGNALDESK_INSTALLED_ENGINE
            $health = Invoke-RestMethod http://127.0.0.1:9780/api/health
            if (!$health.ok -or $health.service -ne 'signaldesk') { throw 'Wrong service health response.' }
          } finally {
            Get-Process broadcast-service -ErrorAction SilentlyContinue | Stop-Process -Force
          }
      - name: Test actual installed engine and bundled tools with real HLS playout
        shell: powershell
        run: |
          python scripts/smoke-streaming.py
          if ($LASTEXITCODE -ne 0) { throw 'Real streaming smoke test failed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: SignalDesk-windows-x64
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Publish versioned Windows installer and checksums
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag must match the application version.' }
          $installer = Get-ChildItem target/release/bundle/nsis/*.exe
          if ($installer.Count -ne 1) { throw 'Expected exactly one Windows installer.' }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content target/release/bundle/nsis/SHA256SUMS.txt -Encoding utf8NoBOM
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME --draft --title "SignalDesk $version" --notes-file docs/release-notes.md
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed.' }
          }
          $signature = Get-Content "$($installer.FullName).sig" -Raw
          $manifest = @{ version = $version; notes = 'SignalDesk desktop update'; pub_date = [DateTime]::UtcNow.ToString('o'); platforms = @{ 'windows-x86_64' = @{ signature = $signature.Trim(); url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME/$($installer.Name)" } } } | ConvertTo-Json -Depth 5
          $manifest | Set-Content target/release/bundle/nsis/latest.json -Encoding utf8NoBOM
          gh release upload $env:GITHUB_REF_NAME "$($installer.FullName).sig" target/release/bundle/nsis/latest.json --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Updater artifact upload failed.' }
          gh release upload $env:GITHUB_REF_NAME src-tauri/runtime/licenses/media/MEDIA-SOURCES.txt $installer.FullName target/release/bundle/nsis/SHA256SUMS.txt --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed.' }
          gh release edit $env:GITHUB_REF_NAME --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
